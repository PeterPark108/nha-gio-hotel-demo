# /etc/nginx/sites-available/nha-gio  (ln -s vào sites-enabled)
# THAY __ADMIN_PATH__ bằng giá trị NHAGIO_ADMIN_PATH trong /etc/nha-gio/admin.env (KHÔNG commit file đã thay).
# Đặt trong http{} (vd /etc/nginx/conf.d/nha-gio-limit.conf):
#   limit_req_zone $binary_remote_addr zone=ng_login:10m rate=10r/m;
#   limit_req_zone $binary_remote_addr zone=ng_admin:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name gio.myagentvn.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gio.myagentvn.com;

    ssl_certificate     /etc/letsencrypt/live/gio.myagentvn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gio.myagentvn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 9m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /srv/nha-gio/www;          # symlink tới bản phát hành mới nhất
    index index.html;
    # Bật khi còn chế độ demo (cùng với noindex trong HTML):
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / { try_files $uri $uri/ =404; }
    location ~* \.(webp|jpg|jpeg|png|css|js|woff2)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
    error_page 404 /404.html;

    # Trang quản trị – đường dẫn bí mật, chỉ chuyển cho app chạy ở 127.0.0.1
    location = /__ADMIN_PATH__/dang-nhap {
        limit_req zone=ng_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8840;
        include /etc/nginx/snippets/nha-gio-proxy.conf;
    }
    location /__ADMIN_PATH__/ {
        limit_req zone=ng_admin burst=40 nodelay;
        proxy_pass http://127.0.0.1:8840;
        include /etc/nginx/snippets/nha-gio-proxy.conf;
    }
}
